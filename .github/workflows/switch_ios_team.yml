name: One-time iOS team switch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch_ios_team.yml

permissions:
  contents: write

jobs:
  switch-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch iOS development team exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          old = "DEVELOPMENT_TEAM = ELEWLD7LJ5;"
          new = "DEVELOPMENT_TEAM = H5B52RL9R2;"

          text = path.read_text(encoding="utf-8")
          old_count = text.count(old)
          new_count = text.count(new)

          if old_count != 3:
              raise SystemExit(f"Expected exactly 3 occurrences of old team, found {old_count}")
          if new_count != 0:
              raise SystemExit(f"Expected 0 occurrences of new team before migration, found {new_count}")

          updated = text.replace(old, new)
          if old in updated:
              raise SystemExit("Old DEVELOPMENT_TEAM remains after replacement")
          if updated.count(new) != 3:
              raise SystemExit(f"Expected exactly 3 occurrences of new team after migration, found {updated.count(new)}")

          path.write_text(updated, encoding="utf-8")
          PY

          git diff --check

      - name: Commit team switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git diff --cached --quiet && { echo "No change staged" >&2; exit 1; }
          git commit -m "fix: switch iOS signing team to CLOXS LLC"
          git push
