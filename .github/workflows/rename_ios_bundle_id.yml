name: One-time iOS bundle ID rename

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename_ios_bundle_id.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename bundle identifier exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          old = "jp.cloxs.bitra"
          new = "jp.cloxs.bittra"

          text = path.read_text(encoding="utf-8")
          old_count = text.count(old)
          new_count = text.count(new)

          if old_count != 6:
              raise SystemExit(f"Expected exactly 6 occurrences of {old}, found {old_count}")
          if new_count != 0:
              raise SystemExit(f"Expected 0 occurrences of {new} before migration, found {new_count}")

          updated = text.replace(old, new)
          if old in updated:
              raise SystemExit(f"{old} remains after replacement")
          if updated.count(new) != 6:
              raise SystemExit(f"Expected exactly 6 occurrences of {new} after migration, found {updated.count(new)}")

          path.write_text(updated, encoding="utf-8")
          PY

          git diff --check

      - name: Commit bundle ID change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git diff --cached --quiet && { echo "No change staged" >&2; exit 1; }
          git commit -m "fix: use jp.cloxs.bittra for iOS bundle id"
          git push
