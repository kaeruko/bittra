name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bittra-ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.cloxs.bittra
  DISPLAY_NAME: びっとら
  EXPECTED_TEAM_ID: H5B52RL9R2
  FLUTTER_VERSION: "3.47.0"
  COCOAPODS_VERSION: "1.16.2"
  BUILD_NUMBER_OFFSET: "100"
  MIN_APP_VERSION: "1.0.3"

jobs:
  build-and-upload:
    name: Build and upload Bittora to TestFlight
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.6.app"
          [[ -d "$XCODE_PATH" ]] || { echo "::error::Required Xcode was not found: $XCODE_PATH"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version and automatic build number
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml)"
          [[ -n "$PUBSPEC_VERSION" ]] || { echo "::error::pubspec.yaml version was not found"; exit 1; }

          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          [[ "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "::error::Unsupported pubspec version: $PUBSPEC_VERSION"
            exit 1
          }

          python3 - "$BUILD_NAME" "$MIN_APP_VERSION" <<'PY'
          import sys

          def version_tuple(value: str):
              parts = value.split('.')
              if not all(part.isdigit() for part in parts):
                  raise SystemExit(f'invalid numeric version: {value}')
              return tuple(int(part) for part in parts) + (0,) * (3 - len(parts))

          actual = sys.argv[1]
          minimum = sys.argv[2]
          if version_tuple(actual) < version_tuple(minimum):
              raise SystemExit(
                  f'pubspec version {actual} is older than minimum TestFlight version {minimum}. '
                  'Bump pubspec.yaml before uploading.'
              )
          PY

          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
            exit 1
          }

          BUILD_NUMBER="$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"
          [[ "$BUILD_NUMBER" -gt 7 ]] || {
            echo "::error::Automatic build number must be greater than existing TestFlight build 7. Got: $BUILD_NUMBER"
            exit 1
          }

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TestFlight version: $BUILD_NAME ($BUILD_NUMBER)"

      - name: Force CocoaPods plugin integration
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter config --list

      - name: Validate repository configuration and required secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = jp.cloxs.bittra;' ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::Expected iOS bundle identifier was not found in the Xcode project"
            exit 1
          }
          grep -Fq 'DEVELOPMENT_TEAM = H5B52RL9R2;' ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::Expected CLOXS LLC development team was not found in the Xcode project"
            exit 1
          }
          ACTUAL_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/Runner/Info.plist)"
          [[ "$ACTUAL_DISPLAY_NAME" == "$DISPLAY_NAME" ]] || {
            echo "::error::CFBundleDisplayName mismatch. Expected $DISPLAY_NAME, got $ACTUAL_DISPLAY_NAME"
            exit 1
          }

          [[ -n "$CERTIFICATE_BASE64" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_BASE64"; exit 1; }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }
          [[ -n "$ASC_KEY_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_ID"; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          [[ -n "$ASC_API_KEY_P8_BASE64" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_P8_BASE64"; exit 1; }

      - name: Install and validate signing material
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/distribution.pem"
          CERTIFICATE_DER="$RUNNER_TEMP/distribution.der"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          [[ -s "$CERTIFICATE_PATH" ]] || { echo "::error::Decoded signing certificate is empty"; exit 1; }
          [[ -s "$PROFILE_PATH" ]] || { echo "::error::Decoded provisioning profile is empty"; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          grep -Fq 'Apple Distribution: CLOXS LLC' <<< "$IDENTITIES" || {
            echo "::error::Expected Apple Distribution: CLOXS LLC identity was not found in the supplied .p12"
            exit 1
          }

          security find-certificate -p -c 'Apple Distribution: CLOXS LLC' "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          [[ -s "$CERTIFICATE_PEM" ]] || { echo "::error::Could not export Apple Distribution certificate"; exit 1; }
          openssl x509 -in "$CERTIFICATE_PEM" -outform DER -out "$CERTIFICATE_DER"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")"

          [[ -n "$PROFILE_UUID" ]] || { echo "::error::Provisioning profile UUID is empty"; exit 1; }
          [[ -n "$PROFILE_NAME" ]] || { echo "::error::Provisioning profile name is empty"; exit 1; }
          [[ "$TEAM_ID" == "$EXPECTED_TEAM_ID" ]] || { echo "::error::Provisioning profile Team ID mismatch. Expected $EXPECTED_TEAM_ID, got $TEAM_ID"; exit 1; }
          [[ "$APP_ID" == "$EXPECTED_TEAM_ID.$BUNDLE_ID" ]] || { echo "::error::Provisioning profile app id mismatch. Expected $EXPECTED_TEAM_ID.$BUNDLE_ID, got $APP_ID"; exit 1; }
          [[ "$GET_TASK_ALLOW" == "false" ]] || { echo "::error::Provisioning profile is not App Store distribution (get-task-allow=$GET_TASK_ALLOW)"; exit 1; }

          PROFILE_PLIST="$PROFILE_PLIST" CERTIFICATE_DER="$CERTIFICATE_DER" python3 - <<'PY'
          import datetime
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as f:
              profile = plistlib.load(f)
          with open(os.environ["CERTIFICATE_DER"], "rb") as f:
              certificate = f.read()

          certs = profile.get("DeveloperCertificates")
          if not isinstance(certs, list) or certificate not in certs:
              raise SystemExit("Provisioning profile does not contain the imported Apple Distribution certificate")

          expires = profile.get("ExpirationDate")
          if not isinstance(expires, datetime.datetime):
              raise SystemExit("Provisioning profile ExpirationDate is missing or invalid")
          if expires.tzinfo is None:
              expires = expires.replace(tzinfo=datetime.timezone.utc)
          if expires <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit(f"Provisioning profile is expired: {expires.isoformat()}")
          PY

          INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$INSTALL_DIR"
          INSTALLED_PROFILE_PATH="$INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$INSTALLED_PROFILE_PATH"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "INSTALLED_PROFILE_PATH=$INSTALLED_PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Resolve dependencies and test
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Generate Flutter iOS configuration
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --config-only \
            --no-codesign

          GENERATED_XCCONFIG="ios/Flutter/Generated.xcconfig"
          [[ -f "$GENERATED_XCCONFIG" ]] || { echo "::error::Generated.xcconfig was not created"; exit 1; }
          grep -Fq "FLUTTER_BUILD_NAME=$BUILD_NAME" "$GENERATED_XCCONFIG" || { echo "::error::Generated.xcconfig build name mismatch"; exit 1; }
          grep -Fq "FLUTTER_BUILD_NUMBER=$BUILD_NUMBER" "$GENERATED_XCCONFIG" || { echo "::error::Generated.xcconfig build number mismatch"; exit 1; }

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods -v "$COCOAPODS_VERSION" --no-document
          pod _${COCOAPODS_VERSION}_ --version
          cd ios
          pod _${COCOAPODS_VERSION}_ install

      - name: Configure Release signing on Runner only
        shell: bash
        run: |
          set -euo pipefail
          export TEAM_ID PROFILE_NAME BUNDLE_ID
          ruby <<'RUBY'
          require "xcodeproj"

          project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          runner = project.targets.find { |target| target.name == "Runner" }
          abort("Runner target was not found") unless runner

          config = runner.build_configurations.find { |item| item.name == "Release" }
          abort("Runner Release configuration was not found") unless config

          config.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
          config.build_settings["CODE_SIGN_STYLE"] = "Manual"
          config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
          config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
          config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
          project.save
          RUBY

          SETTINGS="$(xcodebuild -project ios/Runner.xcodeproj -target Runner -configuration Release -showBuildSettings)"
          grep -Fq "DEVELOPMENT_TEAM = $TEAM_ID" <<< "$SETTINGS" || { echo "::error::Runner Release DEVELOPMENT_TEAM mismatch"; exit 1; }
          grep -Fq 'CODE_SIGN_STYLE = Manual' <<< "$SETTINGS" || { echo "::error::Runner Release is not using manual signing"; exit 1; }
          grep -Fq 'CODE_SIGN_IDENTITY = Apple Distribution' <<< "$SETTINGS" || { echo "::error::Runner Release signing identity mismatch"; exit 1; }
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" <<< "$SETTINGS" || { echo "::error::Runner Release provisioning profile mismatch"; exit 1; }
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" <<< "$SETTINGS" || { echo "::error::Runner Release bundle identifier mismatch"; exit 1; }

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            archive

          APP_PATH="$ARCHIVE_PATH/Products/Applications/Runner.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          [[ -d "$APP_PATH" ]] || { echo "::error::Archived app was not found: $APP_PATH"; exit 1; }
          [[ -f "$INFO_PLIST" ]] || { echo "::error::Archived Info.plist was not found"; exit 1; }

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          ACTUAL_BUILD_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"

          [[ "$ACTUAL_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::Archived bundle id mismatch: $ACTUAL_BUNDLE_ID"; exit 1; }
          [[ "$ACTUAL_DISPLAY_NAME" == "$DISPLAY_NAME" ]] || { echo "::error::Archived display name mismatch: $ACTUAL_DISPLAY_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NAME" == "$BUILD_NAME" ]] || { echo "::error::Archived version mismatch. Expected $BUILD_NAME, got $ACTUAL_BUILD_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || { echo "::error::Archived build number mismatch. Expected $BUILD_NUMBER, got $ACTUAL_BUILD_NUMBER"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNING_DETAILS="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          grep -Fq 'Authority=Apple Distribution: CLOXS LLC' <<< "$SIGNING_DETAILS" || { echo "::error::Archive signing authority mismatch"; exit 1; }
          grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$SIGNING_DETAILS" || { echo "::error::Archive TeamIdentifier mismatch"; exit 1; }

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_DIR="$RUNNER_TEMP/export"

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          rm -rf "$EXPORT_DIR"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          shopt -s nullglob
          IPA_FILES=("$EXPORT_DIR"/*.ipa)
          [[ "${#IPA_FILES[@]}" -eq 1 ]] || { echo "::error::Expected exactly one IPA, found ${#IPA_FILES[@]}"; exit 1; }
          IPA_PATH="${IPA_FILES[0]}"
          [[ -s "$IPA_PATH" ]] || { echo "::error::Exported IPA is empty"; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify exported IPA
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_DIRS=("$VERIFY_DIR"/Payload/*.app)
          [[ "${#APP_DIRS[@]}" -eq 1 && -d "${APP_DIRS[0]}" ]] || { echo "::error::Expected exactly one .app in IPA"; exit 1; }
          APP_DIR="${APP_DIRS[0]}"
          APP_INFO="$APP_DIR/Info.plist"

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          ACTUAL_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")"
          ACTUAL_BUILD_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          BLUETOOTH_USAGE="$(/usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$APP_INFO")"

          [[ "$ACTUAL_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::IPA bundle id mismatch: $ACTUAL_BUNDLE_ID"; exit 1; }
          [[ "$ACTUAL_DISPLAY_NAME" == "$DISPLAY_NAME" ]] || { echo "::error::IPA display name mismatch: $ACTUAL_DISPLAY_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NAME" == "$BUILD_NAME" ]] || { echo "::error::IPA version mismatch. Expected $BUILD_NAME, got $ACTUAL_BUILD_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || { echo "::error::IPA build number mismatch. Expected $BUILD_NUMBER, got $ACTUAL_BUILD_NUMBER"; exit 1; }
          [[ -n "$BLUETOOTH_USAGE" ]] || { echo "::error::NSBluetoothAlwaysUsageDescription is missing"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          SIGNING_DETAILS="$(codesign -dv --verbose=4 "$APP_DIR" 2>&1)"
          grep -Fq 'Authority=Apple Distribution: CLOXS LLC' <<< "$SIGNING_DETAILS" || { echo "::error::IPA signing authority mismatch"; exit 1; }
          grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$SIGNING_DETAILS" || { echo "::error::IPA TeamIdentifier mismatch"; exit 1; }

      - name: Keep IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bittra-ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Install App Store Connect API key
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$KEY_PATH"
          [[ -s "$KEY_PATH" ]] || { echo "::error::Decoded App Store Connect .p8 key is empty"; exit 1; }
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || { echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 did not decode to a .p8 private key"; exit 1; }
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -f "$IPA_PATH" ]] || { echo "::error::IPA not found: $IPA_PATH"; exit 1; }
          [[ -f "$ASC_KEY_PATH" ]] || { echo "::error::App Store Connect key not found: $ASC_KEY_PATH"; exit 1; }

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${ASC_KEY_PATH:-}" && -f "$ASC_KEY_PATH" ]]; then
            rm -f "$ASC_KEY_PATH"
          fi
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" && -f "$INSTALLED_PROFILE_PATH" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
