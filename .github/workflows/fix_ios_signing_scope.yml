name: One-time iOS signing scope fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix_ios_signing_scope.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scope manual signing to Runner target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ios_release_build.yml')
          text = path.read_text(encoding='utf-8')

          old = '''      - name: Archive signed app
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"

          xcodebuild \\
            -workspace ios/Runner.xcworkspace \\
            -scheme Runner \\
            -configuration Release \\
            -sdk iphoneos \\
            -destination 'generic/platform=iOS' \\
            -archivePath "$ARCHIVE_PATH" \\
            -derivedDataPath "$DERIVED_DATA_PATH" \\
            DEVELOPMENT_TEAM="$TEAM_ID" \\
            CODE_SIGN_STYLE=Manual \\
            CODE_SIGN_IDENTITY='Apple Distribution' \\
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \\
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \\
            FLUTTER_BUILD_NAME="$BUILD_NAME" \\
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER" \\
            archive
'''

          new = '''      - name: Configure Release signing on Runner only
        shell: bash
        run: |
          set -euo pipefail
          export TEAM_ID PROFILE_NAME BUNDLE_ID
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort('Runner target was not found') unless runner

          config = runner.build_configurations.find { |item| item.name == 'Release' }
          abort('Runner Release configuration was not found') unless config

          config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
          config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
          config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
          project.save
          RUBY

          SETTINGS="$(xcodebuild -project ios/Runner.xcodeproj -target Runner -configuration Release -showBuildSettings)"
          grep -Fq "DEVELOPMENT_TEAM = $TEAM_ID" <<< "$SETTINGS" || { echo "::error::Runner Release DEVELOPMENT_TEAM mismatch"; exit 1; }
          grep -Fq 'CODE_SIGN_STYLE = Manual' <<< "$SETTINGS" || { echo "::error::Runner Release is not using manual signing"; exit 1; }
          grep -Fq 'CODE_SIGN_IDENTITY = Apple Distribution' <<< "$SETTINGS" || { echo "::error::Runner Release signing identity mismatch"; exit 1; }
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" <<< "$SETTINGS" || { echo "::error::Runner Release provisioning profile mismatch"; exit 1; }
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" <<< "$SETTINGS" || { echo "::error::Runner Release bundle identifier mismatch"; exit 1; }

      - name: Archive signed app
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"

          xcodebuild \\
            -workspace ios/Runner.xcworkspace \\
            -scheme Runner \\
            -configuration Release \\
            -sdk iphoneos \\
            -destination 'generic/platform=iOS' \\
            -archivePath "$ARCHIVE_PATH" \\
            -derivedDataPath "$DERIVED_DATA_PATH" \\
            archive
'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old archive block, found {text.count(old)}')
          if 'Configure Release signing on Runner only' in text:
              raise SystemExit('Signing scope fix already appears to be present')

          updated = text.replace(old, new)
          if updated == text:
              raise SystemExit('Workflow was not changed')
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ios_release_build.yml
          git diff --cached --quiet && { echo "No change staged" >&2; exit 1; }
          git commit -m "fix: scope iOS provisioning profile to Runner target"
          git push
